# NIFTY 50（インド NSE の主要50銘柄・時価総額加重指数）ダッシュボード（/nifty50）。
# 構成銘柄は NSE 上場の個別株50銘柄。価格は Yahoo Finance（yfinance・".NS" サフィックス）で取得。
# build_nifty50.py が処理して nifty50.json を出力する。
#
# 構成銘柄・英語社名・ティッカー形式・データ源は 3D ヒートマップ・プロジェクト
#   https://github.com/kentayoshida/3d_heatmap_ni225  （public/data/nifty50.js）
# に準拠（NIFTY 50 = NSE Nifty 50・50銘柄・時価総額加重・Yahoo Finance・指数 ^NSEI）。
#
# 銘柄名は英語社名（参照元に日本語名が無いため ja/en 共通で英語表記）。銘柄名リンクは
# Yahoo Finance（https://finance.yahoo.com/quote/<ticker>）。株時計・モメンタムは価格系列から算出。
#
# ★ 構成銘柄の更新は手動運用（NIFTY 50 は定期的に入れ替えあり。ダウ30・TOPIX Core30 と同様）。
#    構成銘柄が入れ替わったら下の items（label と ticker）を編集して差し替える。並びはティッカー昇順。

source: yfinance
# 末尾 2 キーは期間リターンではなく 52 週レンジ指標（トグル右端に表示）。
periods: [1D, 1W, 1M, 3M, 6M, YTD, 1Y, DD_52WH, UP_52WL]
total_return_periods: [1Y]   # yfinance Adj Close ベース（配当込み近似）。表示は price 主軸。

sort:
  default: ticker_order      # ticker_order（ティッカー順） | return_desc（選択期間リターン降順）

block:
  id: nifty50
  title: NIFTY 50
  columns: 2                 # UI の表示カラム数（局面バッジで行が伸びるため 2）
