# TOPIX Core 30（時価総額・流動性で選ばれる主力30銘柄）ダッシュボード（/topix-core30）。
# 構成銘柄は東証上場の個別株30銘柄。価格は J-Quants（JPX公式API v2・/equities/bars/daily、
# 分割調整後終値）で取得する。build_topix_core30.py が処理して topix_core30.json を出力する。
#
# 銘柄名リンクは Yahoo!ファイナンス（日本）（https://finance.yahoo.co.jp/quote/<code>.T）。
# 英語社名は web/lib/i18n.ts の CORE30_EN マップ、株時計・モメンタムは価格系列から算出。
#
# ★ 構成銘柄の更新は手動運用（TOPIX Core30 は定期的に入れ替えあり。ダウ30と同様）。
#    構成銘柄が入れ替わったら下の items（code と label）を編集して差し替える。
#    並びは銘柄コード昇順（既定順）。

source: jquants
# 末尾 2 キーは期間リターンではなく 52 週レンジ指標（トグル右端に表示）。
periods: [1D, 1W, 1M, 3M, 6M, YTD, 1Y, DD_52WH, UP_52WL]
total_return_periods: []      # J-Quants は配当込み終値が無いため価格リターンのみ。

sort:
  default: ticker_order        # ticker_order（コード順） | return_desc（選択期間リターン降順）

block:
  id: topix_core30
  title: TOPIX Core30
  columns: 2                   # UI の表示カラム数（局面バッジで行が伸びるため 2 に）
